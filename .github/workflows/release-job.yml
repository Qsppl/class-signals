name: Release Job

on:
  push:
    branches:
      - main

permissions:
  id-token: write # Required for OIDC
  contents: write
  pull-requests: write
  issues: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: node

      # these if statements ensure that tagging only occurs when a new release is created:
      - if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@v4

      - name: Tag Major/Minor Versions
        if: ${{ steps.release.outputs.release_created }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          MAJOR=v${{ steps.release.outputs.major }}
          MINOR=v${{ steps.release.outputs.major }}.${{ steps.release.outputs.minor }}
          git tag -fa "$MAJOR" -m "Release $MAJOR"
          git tag -fa "$MINOR" -m "Release $MINOR"
          git push -f origin "$MAJOR" "$MINOR"

  # Mandatory gate: the package is published only if it works in every consumer environment.
  integration-test:
    needs: release
    if: ${{ needs.release.outputs.release_created == 'true' }}
    uses: ./.github/workflows/integration-test.yml

  publish:
    needs: [release, integration-test]
    if: ${{ needs.release.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Update npm
        # Ensure npm 11.5.1 is installed
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish To NPM
        run: npm publish
